name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # Compiles against net.runelite:client from repo.runelite.net and runs the
      # unit tests. The Plugin Hub builds submissions the same way, so a green
      # run here is the signal that a submission is worth opening.
      - name: Build and test
        run: ./gradlew build --stacktrace
